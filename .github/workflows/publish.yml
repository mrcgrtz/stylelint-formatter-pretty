name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/lithium
          registry-url: https://registry.npmjs.org
      - name: Update npm
        run: npm install --global npm@latest
      - name: Installation
        run: npm ci
      - name: Test
        run: npm test
      - name: Publish
        run: npm publish
